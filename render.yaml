# AgriConnect - Render Blueprint (Infrastructure as Code)
# Renders the PHP app as a Docker web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: agriconnect
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      # ---- MySQL (Option C: your existing MySQL credentials) ----
      # "sync: false" => set the real value in the Render dashboard (Secret).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: agriconnect_db
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      # ---- Optional TLS: enable only if your MySQL host requires it ----
      # - key: DB_SSL_CA
      #   sync: false
      # - key: DB_SSL_NO_VERIFY
      #   value: "1"
    # ---- Persisted uploads ----
    # Render disks require a paid instance plan (the free plan cannot attach a
    # disk). To keep uploaded files across redeploys: switch "plan" above to a
    # paid tier (e.g. starter) and uncomment the block below.
    # disks:
    #   - name: agriconnect-uploads
    #     mountPath: /var/www/html/backend/uploads
    #     sizeGB: 1
