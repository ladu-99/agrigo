# AgriConnect Apache virtual host (Docker)
# The port placeholder __PORT__ is replaced at container start by entrypoint.sh
# with the value of $PORT (default 10000).

<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve raw source of sensitive backend folders.
    <Directory /var/www/html/backend/config>
        Require all denied
    </Directory>
    <Directory /var/www/html/backend/middleware>
        Require all denied
    </Directory>
    <Directory /var/www/html/backend/models>
        Require all denied
    </Directory>

    # Database dumps must not be downloadable.
    <Directory /var/www/html/database>
        Require all denied
    </Directory>

    # Uploaded files stay publicly readable at /backend/uploads/...
    # (that path is intentionally NOT denied.)

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
