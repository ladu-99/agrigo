; AgriConnect PHP runtime tweaks (loaded in addition to the base php.ini)
; Uploads include videos up to 50MB (see backend/api/upload/handler.php),
; so keep these limits above the handler's per-category maximums.
upload_max_filesize = 60M
post_max_size = 60M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Keep production errors out of responses and send logs to stderr.
display_errors = Off
log_errors = On

date.timezone = UTC
